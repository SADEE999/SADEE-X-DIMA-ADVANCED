name: SADEE X DIMA - Build Gaming App + Admin App + Admin Web

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sadee-x-dima-all
  cancel-in-progress: true

jobs:
  build-apps:
    name: Build both Android apps
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Find ZIP
        shell: bash
        run: |
          set -e
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)
          if [ -z "$ZIP_FILE" ]; then echo 'No ZIP in repository root.'; exit 1; fi
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"
      - name: Extract ZIP
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -o "$ZIP_FILE" -d extracted
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Gaming Optimizer APK
        working-directory: extracted/gaming-app
        run: |
          chmod +x gradlew 2>/dev/null || true
          if [ -f ./gradlew ]; then ./gradlew --no-daemon --stacktrace clean assembleDebug; else gradle --no-daemon --stacktrace clean assembleDebug; fi
      - name: Build Admin APK
        working-directory: extracted/admin-app
        run: |
          chmod +x gradlew 2>/dev/null || true
          if [ -f ./gradlew ]; then ./gradlew --no-daemon --stacktrace clean assembleDebug; else gradle --no-daemon --stacktrace clean assembleDebug; fi
      - name: Collect APKs
        run: |
          set -e
          mkdir -p release
          cp "$(find extracted/gaming-app/app/build/outputs/apk -type f -name '*.apk' -print -quit)" release/SADEE_X_DIMA_GAMING_OPTIMIZER.apk
          cp "$(find extracted/admin-app/app/build/outputs/apk -type f -name '*.apk' -print -quit)" release/SADEE_X_DIMA_ADMIN.apk
          ls -lh release
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-ANDROID-APPS
          path: release/*.apk
          retention-days: 30

  deploy-admin-web:
    name: Deploy Admin Web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Find ZIP
        shell: bash
        run: |
          set -e
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)
          if [ -z "$ZIP_FILE" ]; then echo 'No ZIP in repository root.'; exit 1; fi
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"
      - name: Extract ZIP
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -o "$ZIP_FILE" -d extracted
      - name: Locate Admin Panel
        run: |
          set -e
          ADMIN_INDEX=$(find extracted -type f -path '*/admin-panel/index.html' -print -quit)
          if [ -z "$ADMIN_INDEX" ]; then echo 'admin-panel/index.html not found'; exit 1; fi
          echo "ADMIN_DIR=$(dirname "$ADMIN_INDEX")" >> "$GITHUB_ENV"
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Admin Panel
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.ADMIN_DIR }}
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
