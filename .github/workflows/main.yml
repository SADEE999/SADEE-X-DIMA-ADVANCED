name: SADEE X DIMA - Extract + Build App + Admin

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sadee-x-dima
  cancel-in-progress: true

jobs:

  build-android:
    name: Extract ZIP and Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Find and Extract ZIP
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "Found: $ZIP_FILE"

          rm -rf extracted
          mkdir extracted

          unzip -o "$ZIP_FILE" -d extracted

      - name: Locate Android Project
        run: |
          set -e

          APP_DIR=$(find extracted -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit | xargs -r dirname)

          if [ -z "$APP_DIR" ]; then
            echo "ERROR: Android project not found."
            exit 1
          fi

          echo "ANDROID_PROJECT=$APP_DIR" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: ${{ env.ANDROID_PROJECT }}
        run: |
          gradle --no-daemon --stacktrace clean assembleDebug

      - name: Prepare APK
        run: |
          set -e

          APK=$(find "$ANDROID_PROJECT/app/build/outputs/apk" \
            -type f -name "*.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found."
            exit 1
          fi

          mkdir -p release

          cp "$APK" \
            release/SADEE_X_DIMA_GAMING_OPTIMIZER.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-GAMING-OPTIMIZER
          path: release/SADEE_X_DIMA_GAMING_OPTIMIZER.apk
          retention-days: 30


  deploy-admin:
    name: Extract ZIP and Deploy Admin
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Find and Extract ZIP
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "Found: $ZIP_FILE"

          rm -rf extracted
          mkdir extracted

          unzip -o "$ZIP_FILE" -d extracted

      - name: Locate Admin Panel
        run: |
          set -e

          ADMIN_DIR=$(find extracted -type f \
            -path "*/admin-panel/index.html" \
            -print -quit | xargs -r dirname)

          if [ -z "$ADMIN_DIR" ]; then
            echo "ERROR: admin-panel/index.html not found."
            find extracted -maxdepth 4 -type f
            exit 1
          fi

          echo "ADMIN_DIR=$ADMIN_DIR" >> "$GITHUB_ENV"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Admin Panel
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.ADMIN_DIR }}

      - name: Deploy Admin Panel
        id: deployment
        uses: actions/deploy-pages@v4
