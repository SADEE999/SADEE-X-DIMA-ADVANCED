name: SADEE X DIMA - Extract + Build App + Admin

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sadee-x-dima
  cancel-in-progress: true

jobs:

  # =========================================================
  # ANDROID APP
  # =========================================================

  build-android:

    name: Extract ZIP and Build APK
    runs-on: ubuntu-latest

    steps:

      # -----------------------------------------------------
      # CHECKOUT
      # -----------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4


      # -----------------------------------------------------
      # FIND ZIP
      # -----------------------------------------------------

      - name: Find ZIP File
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "======================================"
            echo "ERROR: No ZIP file found"
            echo "======================================"
            ls -la
            exit 1
          fi

          echo "ZIP FOUND:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"


      # -----------------------------------------------------
      # EXTRACT ZIP
      # -----------------------------------------------------

      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          echo "Extracting:"
          echo "$ZIP_FILE"

          rm -rf extracted
          mkdir -p extracted

          unzip -o "$ZIP_FILE" -d extracted

          echo ""
          echo "======================================"
          echo "ZIP EXTRACTED SUCCESSFULLY"
          echo "======================================"

          find extracted -maxdepth 4 -type f | head -150


      # -----------------------------------------------------
      # FIND ANDROID PROJECT
      # -----------------------------------------------------

      - name: Locate Android Project
        shell: bash
        run: |
          set -e

          echo "Searching for Android project..."

          APP_DIR=$(find extracted \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit | xargs -r dirname)

          if [ -z "$APP_DIR" ]; then
            echo ""
            echo "======================================"
            echo "ERROR: Android project not found"
            echo "======================================"
            find extracted -maxdepth 5 -type f
            exit 1
          fi

          echo ""
          echo "ANDROID PROJECT FOUND:"
          echo "$APP_DIR"

          echo "ANDROID_PROJECT=$APP_DIR" >> "$GITHUB_ENV"


      # -----------------------------------------------------
      # CHECK ANDROID PROJECT
      # -----------------------------------------------------

      - name: Check Android Project
        shell: bash
        run: |
          set -e

          echo "Android project:"
          echo "$ANDROID_PROJECT"

          echo ""
          echo "Project files:"
          ls -la "$ANDROID_PROJECT"

          echo ""
          echo "Gradle wrapper:"
          if [ -f "$ANDROID_PROJECT/gradlew" ]; then
            echo "gradlew FOUND"
          else
            echo "gradlew NOT FOUND"
          fi


      # -----------------------------------------------------
      # JAVA 17
      # -----------------------------------------------------

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle


      # -----------------------------------------------------
      # GRADLE 8.9
      # -----------------------------------------------------

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'


      # -----------------------------------------------------
      # BUILD APK
      # -----------------------------------------------------

      - name: Build APK
        working-directory: ${{ env.ANDROID_PROJECT }}
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "BUILDING SADEE X DIMA APK"
          echo "======================================"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew

            ./gradlew \
              --no-daemon \
              --stacktrace \
              clean \
              assembleDebug
          else
            gradle \
              --no-daemon \
              --stacktrace \
              clean \
              assembleDebug
          fi


      # -----------------------------------------------------
      # FIND APK
      # -----------------------------------------------------

      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          APK=$(find "$ANDROID_PROJECT/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo ""
            echo "======================================"
            echo "ERROR: APK NOT FOUND"
            echo "======================================"

            find "$ANDROID_PROJECT/app/build" \
              -type f | head -100

            exit 1
          fi

          echo ""
          echo "APK FOUND:"
          echo "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"


      # -----------------------------------------------------
      # PREPARE APK
      # -----------------------------------------------------

      - name: Prepare Release APK
        shell: bash
        run: |
          set -e

          mkdir -p release

          cp "$APK_PATH" \
            release/SADEE_X_DIMA_GAMING_OPTIMIZER.apk

          echo ""
          echo "======================================"
          echo "APK READY"
          echo "======================================"

          ls -lh release/


      # -----------------------------------------------------
      # UPLOAD APK ARTIFACT
      # -----------------------------------------------------

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-GAMING-OPTIMIZER
          path: release/SADEE_X_DIMA_GAMING_OPTIMIZER.apk
          retention-days: 30


  # =========================================================
  # ADMIN PANEL
  # =========================================================

  deploy-admin:

    name: Extract ZIP and Deploy Admin Panel
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      # -----------------------------------------------------
      # CHECKOUT
      # -----------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4


      # -----------------------------------------------------
      # FIND ZIP
      # -----------------------------------------------------

      - name: Find ZIP File
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "======================================"
            echo "ERROR: No ZIP file found"
            echo "======================================"
            ls -la
            exit 1
          fi

          echo "ZIP FOUND:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"


      # -----------------------------------------------------
      # EXTRACT ZIP
      # -----------------------------------------------------

      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          echo "Extracting ZIP..."

          unzip -o "$ZIP_FILE" -d extracted

          echo ""
          echo "======================================"
          echo "ZIP EXTRACTED"
          echo "======================================"


      # -----------------------------------------------------
      # FIND ADMIN PANEL
      # -----------------------------------------------------

      - name: Locate Admin Panel
        shell: bash
        run: |
          set -e

          echo "Searching for admin-panel..."

          ADMIN_DIR=$(find extracted \
            -type f \
            -path "*/admin-panel/index.html" \
            -print -quit | xargs -r dirname)

          if [ -z "$ADMIN_DIR" ]; then

            ADMIN_DIR=$(find extracted \
              -type f \
              -name "index.html" \
              -print | grep "/admin-panel/" | head -n 1 | xargs -r dirname

          fi

          if [ -z "$ADMIN_DIR" ]; then
            echo ""
            echo "======================================"
            echo "ERROR: admin-panel/index.html NOT FOUND"
            echo "======================================"

            find extracted -maxdepth 5 -type f

            exit 1
          fi

          echo ""
          echo "ADMIN PANEL FOUND:"
          echo "$ADMIN_DIR"

          echo "ADMIN_DIR=$ADMIN_DIR" >> "$GITHUB_ENV"


      # -----------------------------------------------------
      # CHECK ADMIN FILES
      # -----------------------------------------------------

      - name: Check Admin Panel
        shell: bash
        run: |
          set -e

          echo "Admin directory:"
          echo "$ADMIN_DIR"

          echo ""
          echo "Admin files:"

          find "$ADMIN_DIR" -maxdepth 2 -type f


      # -----------------------------------------------------
      # GITHUB PAGES
      # -----------------------------------------------------

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5


      # -----------------------------------------------------
      # UPLOAD ADMIN SITE
      # -----------------------------------------------------

      - name: Upload Admin Panel
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.ADMIN_DIR }}


      # -----------------------------------------------------
      # DEPLOY ADMIN
      # -----------------------------------------------------

      - name: Deploy Admin Panel
        id: deployment
        uses: actions/deploy-pages@v4
