name: SADEE X DIMA - Build All Apps + Admin Web

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sadee-x-dima-build
  cancel-in-progress: true

jobs:

  build-android:
    name: Build Android Apps
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find Source ZIP
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -1)

          if [ -z "$ZIP" ]; then
            echo "No source ZIP found"
            exit 1
          fi

          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "Using: $ZIP"

      - name: Extract Source
        shell: bash
        run: |
          set -e
          rm -rf extracted
          mkdir -p extracted
          unzip -o "$ZIP" -d extracted

      - name: Fix Gaming App Lambda Callbacks
        shell: bash
        run: |
          set -e

          FILE=$(find extracted \
            -type f \
            -path "*/gaming-app/app/src/main/java/com/sadee/gamingoptimizer/MainActivity.java" \
            | head -1)

          if [ -z "$FILE" ]; then
            echo "MainActivity.java not found"
            exit 1
          fi

          python3 - "$FILE" <<'PY'
          import sys
          import re

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              s = f.read()

          fixes = [
              (
                  r'(gameCard\("FREE FIRE","freefire_art",CYAN),\(\)->',
                  r'\1,(v)->'
              ),
              (
                  r'(gameCard\("FREE FIRE MAX","freefire_art",RED),\(\)->',
                  r'\1,(v)->'
              ),
              (
                  r'(gameCard\("PUBG MOBILE","pubg_art",PURPLE),\(\)->',
                  r'\1,(v)->'
              ),
              (
                  r'(gameCard\("COD MOBILE","cod_art",CYAN),\(\)->',
                  r'\1,(v)->'
              )
          ]

          for old, new in fixes:
              s = re.sub(old, new, s)

          with open(path, "w", encoding="utf-8") as f:
              f.write(s)

          print("Gaming callback fix completed.")
          PY

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Gaming Optimizer
        shell: bash
        run: |
          set -e

          DIR=$(find extracted -type d -name "gaming-app" | head -1)

          if [ -z "$DIR" ]; then
            echo "gaming-app not found"
            exit 1
          fi

          cd "$DIR"
          chmod +x gradlew 2>/dev/null || true

          if [ -f gradlew ]; then
            ./gradlew clean assembleDebug --no-daemon
          else
            gradle clean assembleDebug --no-daemon
          fi

      - name: Build Admin App
        shell: bash
        run: |
          set -e

          DIR=$(find extracted -type d -name "admin-app" | head -1)

          if [ -z "$DIR" ]; then
            echo "admin-app not found"
            exit 1
          fi

          cd "$DIR"
          chmod +x gradlew 2>/dev/null || true

          if [ -f gradlew ]; then
            ./gradlew clean assembleDebug --no-daemon
          else
            gradle clean assembleDebug --no-daemon
          fi

      - name: Collect APKs
        shell: bash
        run: |
          set -e

          mkdir -p release

          GAME=$(find extracted/gaming-app \
            -type f -name "*.apk" | head -1)

          ADMIN=$(find extracted/admin-app \
            -type f -name "*.apk" | head -1)

          if [ -z "$GAME" ]; then
            echo "Gaming APK not found"
            exit 1
          fi

          if [ -z "$ADMIN" ]; then
            echo "Admin APK not found"
            exit 1
          fi

          cp "$GAME" release/SADEE_X_DIMA_GAMING_OPTIMIZER.apk
          cp "$ADMIN" release/SADEE_X_DIMA_ADMIN.apk

          ls -lh release

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-APKS
          path: release/*.apk
          retention-days: 30


  deploy-admin:
    name: Deploy Admin Web
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find Source ZIP
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -1)

          if [ -z "$ZIP" ]; then
            echo "No source ZIP found"
            exit 1
          fi

          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract Source
        shell: bash
        run: |
          set -e
          rm -rf extracted
          mkdir -p extracted
          unzip -o "$ZIP" -d extracted

      - name: Find Admin Panel
        shell: bash
        run: |
          set -e

          INDEX=$(find extracted \
            -type f \
            -path "*/admin-panel/index.html" \
            | head -1)

          if [ -z "$INDEX" ]; then
            echo "admin-panel/index.html not found"
            find extracted -type f -name "*.html"
            exit 1
          fi

          DIR=$(dirname "$INDEX")
          echo "ADMIN_DIR=$DIR" >> "$GITHUB_ENV"

          echo "Admin panel found: $DIR"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Admin Panel
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.ADMIN_DIR }}

      - name: Deploy Admin Panel
        id: deployment
        uses: actions/deploy-pages@v4
