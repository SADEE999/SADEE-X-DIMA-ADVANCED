name: Extract ZIP to Repository

on:
  workflow_dispatch:

  push:
    paths:
      - "*.zip"

permissions:
  contents: write

jobs:
  extract-zip:
    name: Extract ZIP
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Find ZIP file
      - name: Find ZIP
        id: find_zip
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "❌ ZIP file not found!"
            exit 1
          fi

          echo "📦 ZIP found: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      # 3. Extract ZIP
      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="${{ steps.find_zip.outputs.zip_file }}"

          rm -rf .github/extracted
          mkdir -p .github/extracted

          echo "📦 Extracting $ZIP_FILE ..."

          unzip -o "$ZIP_FILE" -d .github/extracted

          echo "✅ ZIP extracted successfully"

      # 4. Detect single folder inside ZIP
      - name: Prepare Extracted Files
        shell: bash
        run: |
          set -e

          EXTRACT_DIR=".github/extracted"

          shopt -s dotglob nullglob

          ITEMS=("$EXTRACT_DIR"/*)

          if [ ${#ITEMS[@]} -eq 1 ] && [ -d "${ITEMS[0]}" ]; then
            echo "📁 Single folder detected:"
            echo "${ITEMS[0]}"

            cp -R "${ITEMS[0]}"/. .

          else
            echo "📂 Multiple files/folders detected"

            cp -R "$EXTRACT_DIR"/. .
          fi

      # 5. Remove temporary files
      - name: Cleanup
        shell: bash
        run: |
          rm -rf .github/extracted

          ZIP_FILE="${{ steps.find_zip.outputs.zip_file }}"
          rm -f "$ZIP_FILE"

          echo "🧹 Cleanup complete"

      # 6. Show extracted files
      - name: Verify Files
        shell: bash
        run: |
          echo "================================="
          echo "✅ EXTRACTED REPOSITORY FILES"
          echo "================================="

          find . -maxdepth 3 -type f \
            ! -path "./.git/*" \
            | sort \
            | head -200

      # 7. Commit changes
      - name: Commit Changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "ℹ️ No changes to commit"
            exit 0
          fi

          git commit -m "Extract ZIP source files"

      # 8. Push changes
      - name: Push Changes
        shell: bash
        run: |
          git push

          echo "================================="
          echo "🚀 ZIP EXTRACTION COMPLETE"
          echo "================================="
