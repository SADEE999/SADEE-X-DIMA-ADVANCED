name: Extract ZIP Automatically

on:
  workflow_dispatch:

  push:
    paths:
      - "**.zip"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:

      # 1. Download repository
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Find ZIP anywhere in repository
      - name: Find ZIP File
        id: find_zip
        shell: bash
        run: |
          set -e

          echo "🔎 Searching for ZIP files..."

          ZIP_FILE=$(find . \
            -type f \
            -iname "*.zip" \
            -not -path "./.git/*" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "❌ ZIP file not found!"
            echo ""
            echo "Files currently in repository:"
            find . -maxdepth 4 -type f \
              -not -path "./.git/*" \
              | sort
            exit 1
          fi

          echo "✅ ZIP FOUND:"
          echo "$ZIP_FILE"

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      # 3. Extract ZIP
      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="${{ steps.find_zip.outputs.zip_file }}"

          echo "📦 Extracting:"
          echo "$ZIP_FILE"

          rm -rf .zip_extract
          mkdir -p .zip_extract

          unzip -o "$ZIP_FILE" -d .zip_extract

          echo "✅ Extraction completed!"

      # 4. Copy extracted files
      - name: Copy Files To Repository
        shell: bash
        run: |
          set -e

          shopt -s dotglob nullglob

          EXTRACT_DIR=".zip_extract"

          ITEMS=("$EXTRACT_DIR"/*)

          if [ ${#ITEMS[@]} -eq 0 ]; then
            echo "❌ ZIP is empty!"
            exit 1
          fi

          # If ZIP contains one main folder,
          # copy the contents of that folder
          if [ ${#ITEMS[@]} -eq 1 ] && [ -d "${ITEMS[0]}" ]; then

            echo "📁 Main folder detected:"
            echo "${ITEMS[0]}"

            cp -R "${ITEMS[0]}"/. .

          else

            echo "📂 Copying ZIP contents..."

            cp -R "$EXTRACT_DIR"/. .

          fi

          echo "✅ Files copied!"

      # 5. Remove ZIP and temporary files
      - name: Cleanup
        shell: bash
        run: |
          set -e

          ZIP_FILE="${{ steps.find_zip.outputs.zip_file }}"

          rm -rf .zip_extract

          if [ -f "$ZIP_FILE" ]; then
            rm -f "$ZIP_FILE"
          fi

          echo "🧹 Cleanup completed!"

      # 6. Show result
      - name: Verify Repository
        shell: bash
        run: |
          echo ""
          echo "======================================"
          echo "       SADEE X DIMA BUILD FILES"
          echo "======================================"
          echo ""

          find . \
            -maxdepth 4 \
            -type f \
            -not -path "./.git/*" \
            | sort \
            | head -300

          echo ""
          echo "======================================"

      # 7. Commit
      - name: Commit Changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "ℹ️ Nothing to commit."
            exit 0
          fi

          git commit -m "Extract ZIP files"

      # 8. Push
      - name: Push Changes
        shell: bash
        run: |
          git push

          echo ""
          echo "======================================"
          echo "🚀 ZIP EXTRACTION SUCCESSFUL"
          echo "======================================"
