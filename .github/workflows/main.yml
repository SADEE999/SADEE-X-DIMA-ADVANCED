name: Extract Project ZIP

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    name: Extract ZIP to Repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find ZIP file
        id: find_zip
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No ZIP file found in repository root."
            exit 1
          fi

          echo "ZIP found: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          ZIP="${{ steps.find_zip.outputs.zip }}"

          mkdir -p extracted
          unzip -o "$ZIP" -d extracted

          echo "ZIP extracted successfully."

      - name: Flatten extracted folder
        shell: bash
        run: |
          set -e

          # Find the folder containing the actual project files
          if [ -f "extracted/index.html" ] || [ -f "extracted/settings.gradle" ] || [ -f "extracted/settings.gradle.kts" ]; then
            echo "Project files are already at root level."
          else
            FIRST_DIR=$(find extracted -mindepth 1 -maxdepth 1 -type d | head -n 1)

            if [ -n "$FIRST_DIR" ]; then
              echo "Moving project files from: $FIRST_DIR"

              shopt -s dotglob
              mv "$FIRST_DIR"/* extracted/
              rmdir "$FIRST_DIR" || true
            fi
          fi

      - name: Copy extracted files to repository
        shell: bash
        run: |
          set -e

          shopt -s dotglob

          # Remove ZIP and temporary extraction directory
          rm -f "${{ steps.find_zip.outputs.zip }}"

          # Copy extracted project files to repository root
          cp -R extracted/* .

          rm -rf extracted

      - name: Check extracted files
        shell: bash
        run: |
          echo "===== PROJECT FILES ====="
          find . -maxdepth 3 -type f \
            ! -path "./.git/*" \
            | sort
          echo "========================="

      - name: Commit extracted project
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Extract project ZIP"
          git push
