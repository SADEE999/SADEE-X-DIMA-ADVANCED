name: SADEE X DIMA - FINAL BUILD + ADMIN WEB

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sadee-x-dima-final
  cancel-in-progress: true

jobs:

  build-android:
    name: Build Gaming + Admin APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find FINAL ZIP
        shell: bash
        run: |
          set -e

          ZIP=""

          for f in \
            "./SADEE_X_DIMA_LICENSE_100_PERCENT_FIXED_FINAL.zip" \
            "./SADEE_X_DIMA_LICENSE_100_PERCENT_FIXED.zip"
          do
            if [ -f "$f" ]; then
              ZIP="$f"
              break
            fi
          done

          if [ -z "$ZIP" ]; then
            echo "FINAL source ZIP not found"
            echo "ZIP files in repository:"
            find . -maxdepth 1 -type f -iname "*.zip" -print
            exit 1
          fi

          echo "Using FINAL ZIP: $ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract FINAL Source
        shell: bash
        run: |
          set -e
          rm -rf extracted
          mkdir -p extracted
          unzip -o "$ZIP" -d extracted

      - name: Verify Source
        shell: bash
        run: |
          set -e

          GAME="extracted/gaming-app/app/src/main/java/com/sadee/gamingoptimizer/MainActivity.java"

          if [ ! -f "$GAME" ]; then
            echo "Gaming MainActivity.java missing"
            exit 1
          fi

          echo "Checking license RPC..."
          grep -q 'validate_license' "$GAME"

          echo "Checking key_code..."
          grep -q 'p_key_code' "$GAME"

          echo "Checking username..."
          grep -q 'p_username' "$GAME"

          echo "Checking device ID..."
          grep -q 'p_device_id' "$GAME"

          echo "Source verification PASSED."

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Gaming Optimizer
        shell: bash
        run: |
          set -e

          cd extracted/gaming-app

          chmod +x gradlew 2>/dev/null || true

          if [ -f gradlew ]; then
            ./gradlew clean assembleDebug --no-daemon
          else
            gradle clean assembleDebug --no-daemon
          fi

      - name: Build Admin App
        shell: bash
        run: |
          set -e

          cd extracted/admin-app

          chmod +x gradlew 2>/dev/null || true

          if [ -f gradlew ]; then
            ./gradlew clean assembleDebug --no-daemon
          else
            gradle clean assembleDebug --no-daemon
          fi

      - name: Collect APKs
        shell: bash
        run: |
          set -e

          mkdir -p release

          GAME=$(find extracted/gaming-app/app/build/outputs/apk \
            -type f -name "*.apk" | head -1)

          ADMIN=$(find extracted/admin-app/app/build/outputs/apk \
            -type f -name "*.apk" | head -1)

          if [ -z "$GAME" ]; then
            echo "Gaming APK not found"
            exit 1
          fi

          if [ -z "$ADMIN" ]; then
            echo "Admin APK not found"
            exit 1
          fi

          cp "$GAME" release/SADEE_X_DIMA_GAMING_OPTIMIZER.apk
          cp "$ADMIN" release/SADEE_X_DIMA_ADMIN.apk

          echo "FINAL APKs:"
          ls -lh release

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-FINAL-APKS
          path: release/*.apk
          retention-days: 30


  deploy-admin:
    name: Deploy Admin Web
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find FINAL ZIP
        shell: bash
        run: |
          set -e

          ZIP=""

          for f in \
            "./SADEE_X_DIMA_LICENSE_100_PERCENT_FIXED_FINAL.zip" \
            "./SADEE_X_DIMA_LICENSE_100_PERCENT_FIXED.zip"
          do
            if [ -f "$f" ]; then
              ZIP="$f"
              break
            fi
          done

          if [ -z "$ZIP" ]; then
            echo "FINAL source ZIP not found"
            exit 1
          fi

          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract FINAL Source
        shell: bash
        run: |
          set -e
          rm -rf extracted
          mkdir -p extracted
          unzip -o "$ZIP" -d extracted

      - name: Find Admin Panel
        shell: bash
        run: |
          set -e

          INDEX=$(find extracted \
            -type f \
            -path "*/admin-panel/index.html" \
            | head -1)

          if [ -z "$INDEX" ]; then
            echo "admin-panel/index.html not found"
            exit 1
          fi

          DIR=$(dirname "$INDEX")

          echo "ADMIN_DIR=$DIR" >> "$GITHUB_ENV"

          echo "Admin panel: $DIR"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Admin Panel
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.ADMIN_DIR }}

      - name: Deploy Admin Panel
        id: deployment
        uses: actions/deploy-pages@v4
