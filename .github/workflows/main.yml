name: SADEE X DIMA APK Builder

on:
workflow_dispatch:
push:
branches:
- main

permissions:
contents: read

jobs:
extract:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Check ZIP files
    run: |
      find . -maxdepth 2 -type f -name "*.zip"

  - name: Extract project ZIP
    run: |
      ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

      if [ -z "$ZIP_FILE" ]; then
        echo "ERROR: No ZIP file found in repository."
        exit 1
      fi

      mkdir -p extracted
      unzip -o "$ZIP_FILE" -d extracted

      echo "ZIP extracted successfully."
      find extracted -maxdepth 4 -type f | head -100

  - name: Upload extracted project
    uses: actions/upload-artifact@v4
    with:
      name: SADEE-X-DIMA-EXTRACTED
      path: extracted/
      if-no-files-found: error
