
name: SADEE X DIMA APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract Nested ZIP Files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p extracted
          find . -maxdepth 1 -type f -iname "*.zip" \
            -print0 > /tmp/ziplist

          while IFS= read -r -d '' zipfile; do
            echo "Checking: $zipfile"
            unzip -oq "$zipfile" -d extracted
          done < /tmp/ziplist

          for round in 1 2 3; do
            find extracted -type f -iname "*.zip" \
              -print0 > /tmp/nested-zips

            while IFS= read -r -d '' zipfile; do
              echo "Extracting nested ZIP: $zipfile"
              target="${zipfile%.zip}_extracted"
              mkdir -p "$target"
              unzip -oq "$zipfile" -d "$target"
            done < /tmp/nested-zips
          done

      - name: Locate Android Gradle Project
        shell: bash
        run: |
          set -euo pipefail

          GRADLEW="$(find extracted -type f \
            -name gradlew -print -quit)"

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: Android project not found in ZIP"
            echo "The extracted files must contain gradlew."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          chmod +x "$GRADLEW"

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
