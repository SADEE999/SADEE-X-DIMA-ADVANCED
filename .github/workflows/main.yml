
name: SADEE X DIMA - Build APKs

'on':
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Fixed ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 3 -type f \
            -name 'SADEE_X_DIMA_PRO_FIXED.zip' \
            -not -path './.git/*' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE="$(find . -maxdepth 3 -type f \
              -name '*.zip' -not -path './.git/*' | head -n 1)"
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found."
            exit 1
          fi

          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

          GAMING="$(find extracted -type f \
            -name settings.gradle \
            -path '*/gaming-app/settings.gradle' \
            -print -quit | xargs -r dirname)"

          ADMIN="$(find extracted -type f \
            -name settings.gradle \
            -path '*/admin-app/settings.gradle' \
            -print -quit | xargs -r dirname)"

          test -n "$GAMING" || {
            echo "Gaming project not found in ZIP."
            exit 1
          }

          test -n "$ADMIN" || {
            echo "Admin project not found in ZIP."
            exit 1
          }

          echo "GAMING_DIR=$GAMING" >> "$GITHUB_ENV"
          echo "ADMIN_DIR=$ADMIN" >> "$GITHUB_ENV"

      - name: Build Gaming APK
        run: gradle -p "$GAMING_DIR" assembleDebug

      - name: Build Admin APK
        run: gradle -p "$ADMIN_DIR" assembleDebug

      - name: Upload Gaming APK
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-Gaming-APK
          path: ${{ env.GAMING_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-Admin-APK
          path: ${{ env.ADMIN_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
