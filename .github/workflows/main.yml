name: SADEE X DIMA PRO - Extract and Build APK

on:
workflow_dispatch:
push:
paths:
- "*.zip"

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout Repository
    uses: actions/checkout@v4

  - name: Setup Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "17"

  - name: Find and Extract ZIP
    run: |
      ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

      if [ -z "$ZIP_FILE" ]; then
        echo "ERROR: ZIP file not found in repository root."
        exit 1
      fi

      echo "Extracting: $ZIP_FILE"
      mkdir -p extracted
      unzip -o "$ZIP_FILE" -d extracted

      echo "Extracted project files:"
      find extracted -maxdepth 3 -type f | head -100

  - name: Build Gaming App APK
    working-directory: extracted/sadee_src/gaming-app
    run: |
      chmod +x gradlew 2>/dev/null || true
      if [ -f gradlew ]; then
        ./gradlew assembleDebug
      else
        gradle assembleDebug
      fi

  - name: Build Admin App APK
    working-directory: extracted/sadee_src/admin-app
    run: |
      chmod +x gradlew 2>/dev/null || true
      if [ -f gradlew ]; then
        ./gradlew assembleDebug
      else
        gradle assembleDebug
      fi

  - name: Upload Gaming APK
    uses: actions/upload-artifact@v4
    with:
      name: SADEE-X-DIMA-Gaming-APK
      path: extracted/sadee_src/gaming-app/app/build/outputs/apk/debug/*.apk
      if-no-files-found: error

  - name: Upload Admin APK
    uses: actions/upload-artifact@v4
    with:
      name: SADEE-X-DIMA-Admin-APK
      path: extracted/sadee_src/admin-app/app/build/outputs/apk/debug/*.apk
      if-no-files-found: error
