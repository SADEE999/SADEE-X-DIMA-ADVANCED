name: Extract SADEE X DIMA ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"

jobs:
  extract:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "❌ No ZIP file found"
            exit 1
          fi

          echo "📦 Found: $ZIP_FILE"

          mkdir -p extracted

          unzip -o "$ZIP_FILE" -d extracted

          echo "✅ ZIP extracted successfully"

          find extracted -maxdepth 3 -type f | head -100

      - name: Move extracted files to repository
        shell: bash
        run: |
          shopt -s dotglob

          if [ -d "extracted" ]; then
            cp -R extracted/* .
          fi

          rm -rf extracted

      - name: Remove ZIP
        shell: bash
        run: |
          rm -f ./*.zip

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "ℹ️ Nothing to commit"
          else
            git commit -m "Extract SADEE X DIMA source ZIP"
            git push
          fi
