name: SADEE X DIMA APK Builder

on:
workflow_dispatch:
push:
branches:
- main

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout Repository
    uses: actions/checkout@v4

  - name: Setup Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "17"

  - name: Setup Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: "8.9"

  - name: Find and Extract ZIP
    shell: bash
    run: |
      set -euo pipefail

      ZIP_FILE="$(find . -maxdepth 2 -type f -name '*.zip' \
        -not -path './.git/*' | head -n 1)"

      if [ -z "$ZIP_FILE" ]; then
        echo "ERROR: ZIP file not found."
        echo "Upload your project ZIP to the repository first."
        exit 1
      fi

      echo "Extracting: $ZIP_FILE"
      mkdir -p extracted
      unzip -o "$ZIP_FILE" -d extracted

      echo "Extracted project folders:"
      find extracted -maxdepth 4 -type f \
        \( -name 'settings.gradle' -o -name 'build.gradle' \)

  - name: Build Gaming APK
    shell: bash
    run: |
      set -euo pipefail
      cd extracted/sadee_src/gaming-app
      gradle assembleDebug

  - name: Build Admin APK
    shell: bash
    run: |
      set -euo pipefail
      cd extracted/sadee_src/admin-app
      gradle assembleDebug

  - name: Upload Gaming APK
    uses: actions/upload-artifact@v4
    with:
      name: SADEE-X-DIMA-Gaming-APK
      path: extracted/sadee_src/gaming-app/app/build/outputs/apk/debug/*.apk
      if-no-files-found: error

  - name: Upload Admin APK
    uses: actions/upload-artifact@v4
    with:
      name: SADEE-X-DIMA-Admin-APK
      path: extracted/sadee_src/admin-app/app/build/outputs/apk/debug/*.apk
      if-no-files-found: error
