name: Extract Project ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    name: Extract ZIP to Repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find ZIP file
        id: find_zip
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No ZIP file found in repository root."
            exit 1
          fi

          echo "ZIP found: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          ZIP="${{ steps.find_zip.outputs.zip }}"

          rm -rf extracted
          mkdir -p extracted

          unzip -o "$ZIP" -d extracted

          echo "ZIP extracted successfully."

      - name: Flatten project
        shell: bash
        run: |
          set -e

          if [ -f "extracted/settings.gradle" ] || \
             [ -f "extracted/settings.gradle.kts" ] || \
             [ -f "extracted/index.html" ]; then

            echo "Project already at root."

          else

            FIRST_DIR=$(find extracted \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              ! -name ".github" \
              | head -n 1)

            if [ -n "$FIRST_DIR" ]; then
              echo "Project folder: $FIRST_DIR"

              shopt -s dotglob nullglob

              mkdir -p project

              for item in "$FIRST_DIR"/*; do
                base=$(basename "$item")

                if [ "$base" != ".github" ]; then
                  mv "$item" project/
                fi
              done

              rm -rf "$FIRST_DIR"

              shopt -u dotglob nullglob
            fi
          fi

      - name: Copy project files
        shell: bash
        run: |
          set -e

          shopt -s dotglob nullglob

          # Remove only the uploaded ZIP
          ZIP="${{ steps.find_zip.outputs.zip }}"
          rm -f "$ZIP"

          # Copy extracted project files
          for item in extracted/*; do
            base=$(basename "$item")

            # IMPORTANT:
            # Never copy .github from ZIP.
            if [ "$base" = ".github" ]; then
              continue
            fi

            cp -R "$item" .
          done

          # Copy nested project folder if created
          if [ -d "project" ]; then
            for item in project/*; do
              cp -R "$item" .
            done

            rm -rf project
          fi

          rm -rf extracted

          shopt -u dotglob nullglob

      - name: Verify Android project
        shell: bash
        run: |
          echo "===== PROJECT FILES ====="

          find . -maxdepth 5 -type f \
            ! -path "./.git/*" \
            | sort

          echo "========================="

          test -f settings.gradle || \
          test -f settings.gradle.kts || \
          {
            echo "ERROR: Android Gradle project not found."
            exit 1
          }

          test -f app/build.gradle || \
          test -f app/build.gradle.kts || \
          {
            echo "ERROR: app/build.gradle not found."
            exit 1
          }

      - name: Commit extracted project
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Extract Android project [skip ci]"

          git push
