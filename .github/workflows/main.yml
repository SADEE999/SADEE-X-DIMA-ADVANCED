name: SADEE X DIMA - PAID ADVANCED V4 APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sadee-x-dima-v4
  cancel-in-progress: true

jobs:
  build:
    name: Build SADEE X DIMA V4
    runs-on: ubuntu-latest

    steps:

      # 1. Get repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Find exact V4 ZIP
      - name: Find V4 ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -type f \
            -name "SADEE_X_DIMA_PAID_ADVANCED_V4.zip" \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: SADEE_X_DIMA_PAID_ADVANCED_V4.zip not found!"
            echo ""
            echo "ZIP files found:"
            find . -type f -iname "*.zip" -print
            exit 1
          fi

          echo "ZIP FOUND: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      # 3. Extract project
      - name: Extract V4 Project
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -o "$ZIP_FILE" -d extracted

          echo "Extraction complete."

      # 4. Find Android project automatically
      - name: Find Android Project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(find extracted -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found!"
            echo ""
            echo "Files found:"
            find extracted -maxdepth 8 -type f -print
            exit 1
          fi

          echo "ANDROID PROJECT: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 5. Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # 6. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # 7. Install required Android packages
      - name: Install Android SDK Packages
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "ANDROID SDK READY"

      # 8. Gradle 8.7
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # 9. Check project
      - name: Check Android Project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo " SADEE X DIMA SENSI"
          echo " PAID ADVANCED V4"
          echo "======================================"

          echo "Project:"
          pwd

          echo ""
          echo "Project files:"
          ls -la

      # 10. Build Debug APK
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

          echo ""
          echo "======================================"
          echo " BUILD SUCCESSFUL"
          echo "======================================"

      # 11. Find APK
      - name: Find APK
        shell: bash
        run: |
          echo "APK FILES:"
          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

      # 12. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-PAID-ADVANCED-V4-APK
          path: |
            extracted/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
