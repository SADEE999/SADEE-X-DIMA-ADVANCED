
name: SADEE X DIMA APK Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract All ZIP Files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p extracted
          find . -maxdepth 1 -type f -iname '*.zip' \
            -exec unzip -oq '{}' -d extracted \;

          for round in 1 2 3 4 5; do
            found=0

            while IFS= read -r -d '' z; do
              found=1
              dest="${z%.zip}_unpacked"
              mkdir -p "$dest"
              unzip -oq "$z" -d "$dest"
            done < <(
              find extracted -type f -iname '*.zip' \
                -not -path '*/_unpacked/*' -print0
            )

            [ "$found" -eq 1 ] || break
          done

      - name: Diagnose Android Project
        shell: bash
        run: |
          echo "=== Extracted files ==="
          find extracted -maxdepth 5 -type f | head -200

          echo "=== Gradle project files ==="
          find extracted -type f \( \
            -name gradlew -o \
            -name settings.gradle -o \
            -name settings.gradle.kts -o \
            -name build.gradle -o \
            -name build.gradle.kts \
          \) -print

      - name: Find Project
        shell: bash
        run: |
          set -euo pipefail

          WRAPPER="$(find extracted -type f \
            -name gradlew -print -quit)"

          if [ -n "$WRAPPER" ]; then
            DIR="$(dirname "$WRAPPER")"
            chmod +x "$WRAPPER"
            echo "BUILD_DIR=$DIR" >> "$GITHUB_ENV"
            echo "BUILD_CMD=./gradlew" >> "$GITHUB_ENV"
            exit 0
          fi

          SETTINGS="$(find extracted -type f \( \
            -name settings.gradle -o \
            -name settings.gradle.kts \
          \) -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: No Gradle Android project found."
            echo "Check the diagnostic output above."
            exit 1
          fi

          DIR="$(dirname "$SETTINGS")"
          echo "BUILD_DIR=$DIR" >> "$GITHUB_ENV"
          echo "BUILD_CMD=gradle" >> "$GITHUB_ENV"

      - name: Setup Gradle
        if: env.BUILD_CMD == 'gradle'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$BUILD_DIR"
          $BUILD_CMD assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
