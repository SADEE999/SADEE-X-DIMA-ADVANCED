
name: SADEE X DIMA APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Find Android Project
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Android project files..."

          PROJECT_DIR=""

          if [ -f "./gradlew" ]; then
            PROJECT_DIR="."
          else
            PROJECT_DIR="$(find . -type f -name gradlew \
              -not -path './.git/*' \
              -print -quit | xargs -r dirname)"
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: gradlew was not found."
            echo "Repository file list:"
            find . -maxdepth 5 -type f | head -200
            echo "Upload the complete Android source project."
            exit 1
          fi

          echo "Found project: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          chmod +x "$PROJECT_DIR/gradlew"

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
