name: Auto Extract ZIP

on:
  push:
    paths:
      - "**.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find ZIP
        id: zip
        run: |
          ZIP=$(find . -type f -iname "*.zip" -not -path "./.git/*" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "❌ ZIP file not found"
            exit 1
          fi

          echo "Found: $ZIP"
          echo "file=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract ZIP
        run: |
          set -e

          ZIP="${{ steps.zip.outputs.file }}"

          rm -rf extracted
          mkdir extracted

          unzip -o "$ZIP" -d extracted

          echo "✅ ZIP extracted"

      - name: Copy files to repository
        run: |
          set -e

          shopt -s dotglob nullglob
          ITEMS=(extracted/*)

          # ZIP එක ඇතුළේ එක folder එකක් විතරක් නම්
          # ඒ folder එකේ files root එකට ගන්නවා.
          if [ ${#ITEMS[@]} -eq 1 ] && [ -d "${ITEMS[0]}" ]; then
            cp -R "${ITEMS[0]}"/. .
          else
            cp -R extracted/. .
          fi

      - name: Delete ZIP
        run: |
          rm -rf extracted
          rm -f "${{ steps.zip.outputs.file }}"

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Auto extract ZIP"

      - name: Push
        run: |
          git push
