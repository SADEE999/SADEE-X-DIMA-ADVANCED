name: SADEE X DIMA - V3.1 APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sadee-x-dima-v31
  cancel-in-progress: true

jobs:
  build:
    name: Build SADEE X DIMA V3.1
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Find V3.1 ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -type f \
            -name "SADEE_X_DIMA_HACKER_UPGRADE_V3_1_GAME_LAUNCH_FIX.zip" \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: V3.1 ZIP not found!"
            echo ""
            echo "ZIP files found:"
            find . -type f -iname "*.zip" -print
            exit 1
          fi

          echo "ZIP FOUND: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract V3.1 Project
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -o "$ZIP_FILE" -d extracted

          echo "Extraction complete."

      - name: Find Android Project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(find extracted -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found!"
            find extracted -maxdepth 7 -type f
            exit 1
          fi

          echo "ANDROID PROJECT: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK Packages
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "ANDROID SDK READY"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Check Project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=============================="
          echo " SADEE X DIMA SENSI V3.1"
          echo " GAME LAUNCH FIX"
          echo "=============================="

          pwd
          ls -la

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

          echo "BUILD SUCCESSFUL"

      - name: Find APK
        shell: bash
        run: |
          echo "APK FILES:"
          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload V3.1 APK
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-SENSI-V3.1-APK
          path: |
            extracted/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
