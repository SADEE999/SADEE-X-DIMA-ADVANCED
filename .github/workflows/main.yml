name: SADEE X DIMA - Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check Android project
        shell: bash
        run: |
          set -e

          echo "===== PROJECT CHECK ====="

          test -f settings.gradle || {
            echo "ERROR: settings.gradle not found"
            exit 1
          }

          test -f build.gradle || {
            echo "ERROR: build.gradle not found"
            exit 1
          }

          test -f app/build.gradle || {
            echo "ERROR: app/build.gradle not found"
            exit 1
          }

          test -f app/src/main/AndroidManifest.xml || {
            echo "ERROR: AndroidManifest.xml not found"
            exit 1
          }

          echo "Android project structure OK."

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          echo "===== BUILDING APK ====="

          gradle \
            --no-daemon \
            --stacktrace \
            clean \
            assembleDebug

          echo "APK build completed successfully."

      - name: Find APK
        id: find_apk
        shell: bash
        run: |
          set -e

          APK=$(find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found."
            find app/build -type f | sort || true
            exit 1
          fi

          echo "APK found: $APK"
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      - name: Prepare release APK
        shell: bash
        run: |
          set -e

          mkdir -p release

          cp "${{ steps.find_apk.outputs.apk_path }}" \
            "release/SADEE_X_DIMA_GAMING_OPTIMIZER.apk"

          echo "===== APK READY ====="
          ls -lh release/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-GAMING-OPTIMIZER-APK
          path: release/SADEE_X_DIMA_GAMING_OPTIMIZER.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build Summary
        shell: bash
        run: |
          echo "## 🎮 SADEE X DIMA GAMING OPTIMIZER" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### ✅ APK Build Successful" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**APK:** SADEE_X_DIMA_GAMING_OPTIMIZER.apk" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Download the APK from the Artifacts section." >> "$GITHUB_STEP_SUMMARY"
