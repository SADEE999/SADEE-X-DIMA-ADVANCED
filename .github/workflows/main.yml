name: SADEE X DIMA - V3 APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sadee-x-dima-v3
  cancel-in-progress: true

jobs:
  build:
    name: Build SADEE X DIMA V3
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Find V3 ZIP
      - name: Find V3 ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -type f \
            -name "SADEE_X_DIMA_HACKER_UPGRADE_V3.zip" \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: SADEE_X_DIMA_HACKER_UPGRADE_V3.zip not found!"
            echo ""
            echo "ZIP files found:"
            find . -type f -iname "*.zip" -print
            exit 1
          fi

          echo "ZIP FOUND: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      # 3. Extract ZIP
      - name: Extract V3 Project
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -o "$ZIP_FILE" -d extracted

          echo "=============================="
          echo " EXTRACTION COMPLETE"
          echo "=============================="

          find extracted -maxdepth 5 -type f | head -200

      # 4. Find Android project
      - name: Find Android Project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(find extracted -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found!"
            find extracted -maxdepth 7 -type f
            exit 1
          fi

          echo "ANDROID PROJECT:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 5. Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # 6. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # 7. Install Android SDK
      - name: Install Android SDK Packages
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "ANDROID SDK READY"

      # 8. Gradle 8.7
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # 9. Check project
      - name: Check Project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=============================="
          echo " PROJECT DIRECTORY"
          echo "=============================="

          pwd

          echo ""
          echo "FILES:"
          ls -la

          echo ""
          echo "GRADLE FILES:"
          find . -maxdepth 4 -type f \
            \( -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "settings.gradle" \
            -o -name "settings.gradle.kts" \) \
            -print

      # 10. Build Debug APK
      - name: Build V3 Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo ""
          echo "========================================"
          echo " SADEE X DIMA SENSI"
          echo " HACKER UPGRADE V3"
          echo " RGB DEVICE UI"
          echo " OPTIMIZER SADEE X DIMA"
          echo "========================================"
          echo ""

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

          echo ""
          echo "BUILD SUCCESSFUL"

      # 11. Find APK
      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "=============================="
          echo " APK FILES"
          echo "=============================="

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

      # 12. Upload APK
      - name: Upload V3 APK
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-SENSI-V3-APK
          path: |
            extracted/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
