name: SADEE X DIMA - Hacker Upgrade APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sadee-x-dima-apk
  cancel-in-progress: true

jobs:
  build:
    name: Build SADEE X DIMA APK
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout Repository
        uses: actions/checkout@v4


      # 2. Find ZIP
      - name: Find ZIP
        shell: bash
        run: |
          set -e

          echo "Searching for ZIP..."

          ZIP_FILE=$(find . -maxdepth 3 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found!"
            find . -maxdepth 3 -type f
            exit 1
          fi

          echo "ZIP FOUND: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"


      # 3. Extract ZIP
      - name: Extract Android Project
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -o "$ZIP_FILE" -d extracted

          echo "Extraction complete."

          find extracted -maxdepth 5 -type f | head -200


      # 4. Find Gradle project
      - name: Find Android Project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(find extracted -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found!"
            find extracted -maxdepth 6 -type f
            exit 1
          fi

          echo "ANDROID PROJECT: $PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # 5. Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle


      # 6. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'


      # 7. Install SDK
      - name: Install Android SDK Packages
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK READY"


      # 8. Gradle 8.7
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"


      # 9. Check project
      - name: Check Project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "PROJECT:"
          pwd

          echo ""
          echo "FILES:"
          ls -la

          echo ""
          echo "GRADLE FILES:"
          find . -maxdepth 3 -type f \
            \( -name "build.gradle" \
            -o -name "settings.gradle" \) \
            -print


      # 10. Build APK
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "================================"
          echo " SADEE X DIMA OPTIMIZER V2"
          echo " HACKER UPGRADE BUILD"
          echo "================================"

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

          echo "BUILD SUCCESSFUL"


      # 11. Find APK
      - name: Find APK
        shell: bash
        run: |
          echo "APK FILES:"

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print


      # 12. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-HACKER-V2-APK
          path: |
            extracted/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
