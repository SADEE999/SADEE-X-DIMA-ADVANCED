name: SADEE X DIMA - Extract ZIP & Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Extract Project & Build APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Find and extract ZIP
      - name: Extract SADEE X DIMA ZIP
        shell: bash
        run: |
          set -e

          echo "Searching for ZIP file..."

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            echo "Upload SADEE_X_DIMA_ADVANCED.zip to the repository."
            exit 1
          fi

          echo "ZIP found: $ZIP_FILE"

          mkdir -p extracted

          unzip -o "$ZIP_FILE" -d extracted

          echo "Extraction completed."

          echo "Extracted files:"
          find extracted -maxdepth 3 -type f | head -100

      # 3. Detect Android project
      - name: Find Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(find extracted -type f -name "settings.gradle*" -o -name "settings.gradle.kts" \
            | head -n 1 | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found."
            exit 1
          fi

          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 4. Setup Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 5. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 6. Install required Android SDK
      - name: Install Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 7. Give Gradle permission
      - name: Fix Gradle permissions
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      # 8. Build Debug APK
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            echo "gradlew not found."
            echo "Creating Gradle wrapper is required."
            exit 1
          fi

      # 9. Find APK
      - name: Find APK
        shell: bash
        run: |
          echo "APK files:"

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

      # 10. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-APK
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error
