name: SADEE X DIMA - Extract + Build App + Admin

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sadee-x-dima
  cancel-in-progress: true

jobs:

  # =====================================================
  # ANDROID APP
  # =====================================================

  build-android:
    name: Extract ZIP and Build APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Find ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository root."
            ls -la
            exit 1
          fi

          echo "ZIP FOUND: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -o "$ZIP_FILE" -d extracted

          echo "ZIP extracted successfully."
          find extracted -maxdepth 4 -type f | head -150

      - name: Locate Android Project
        shell: bash
        run: |
          set -e

          APP_DIR=$(find extracted \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$APP_DIR" ]; then
            echo "ERROR: Android project not found."
            find extracted -maxdepth 5 -type f
            exit 1
          fi

          APP_DIR=$(dirname "$APP_DIR")

          echo "ANDROID PROJECT: $APP_DIR"
          echo "ANDROID_PROJECT=$APP_DIR" >> "$GITHUB_ENV"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: ${{ env.ANDROID_PROJECT }}
        shell: bash
        run: |
          set -e

          echo "Building Android APK..."

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon --stacktrace clean assembleDebug
          else
            gradle --no-daemon --stacktrace clean assembleDebug
          fi

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK=$(find "$ANDROID_PROJECT/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created."
            find "$ANDROID_PROJECT/app/build" -type f | head -100
            exit 1
          fi

          echo "APK FOUND: $APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Prepare APK
        shell: bash
        run: |
          set -e

          mkdir -p release

          cp "$APK_PATH" \
            release/SADEE_X_DIMA_GAMING_OPTIMIZER.apk

          ls -lh release/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-GAMING-OPTIMIZER
          path: release/SADEE_X_DIMA_GAMING_OPTIMIZER.apk
          retention-days: 30


  # =====================================================
  # ADMIN PANEL
  # =====================================================

  deploy-admin:
    name: Extract ZIP and Deploy Admin Panel
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Find ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository root."
            ls -la
            exit 1
          fi

          echo "ZIP FOUND: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -o "$ZIP_FILE" -d extracted

          echo "ZIP extracted successfully."

      - name: Locate Admin Panel
        shell: bash
        run: |
          set -e

          echo "Searching for admin-panel..."

          ADMIN_INDEX=$(find extracted \
            -type f \
            -path "*/admin-panel/index.html" \
            -print -quit)

          if [ -z "$ADMIN_INDEX" ]; then
            echo "ERROR: admin-panel/index.html not found."

            echo "Available index.html files:"
            find extracted -type f -name "index.html"

            exit 1
          fi

          ADMIN_DIR=$(dirname "$ADMIN_INDEX")

          echo "ADMIN PANEL FOUND:"
          echo "$ADMIN_DIR"

          echo "ADMIN_DIR=$ADMIN_DIR" >> "$GITHUB_ENV"

      - name: Check Admin Panel
        shell: bash
        run: |
          set -e

          echo "Admin panel directory:"
          echo "$ADMIN_DIR"

          echo "Admin files:"
          find "$ADMIN_DIR" -maxdepth 2 -type f

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Admin Panel
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.ADMIN_DIR }}

      - name: Deploy Admin Panel
        id: deployment
        uses: actions/deploy-pages@v4
