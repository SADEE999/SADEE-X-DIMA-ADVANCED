name: SADEE X DIMA - Build All Apps + Admin Web

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sadee-x-dima-all
  cancel-in-progress: true

jobs:

  # =========================================================
  # ANDROID APPS
  # =========================================================
  build-apps:
    name: Build Gaming Optimizer + Admin APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      # -----------------------------------------------------
      # Find uploaded ZIP
      # -----------------------------------------------------
      - name: Find Source ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "❌ No ZIP file found in repository root."
            exit 1
          fi

          echo "✅ Found ZIP: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      # -----------------------------------------------------
      # Extract ZIP
      # -----------------------------------------------------
      - name: Extract Source ZIP
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -o "$ZIP_FILE" -d extracted

          echo "===== Extracted Files ====="
          find extracted -maxdepth 3 -type f | head -200

      # -----------------------------------------------------
      # Java
      # -----------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # -----------------------------------------------------
      # Gradle 8.9
      # -----------------------------------------------------
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # -----------------------------------------------------
      # Check Gaming App
      # -----------------------------------------------------
      - name: Check Gaming App
        shell: bash
        run: |
          set -e

          if [ ! -d "extracted/gaming-app" ]; then
            echo "❌ gaming-app folder not found"
            exit 1
          fi

          if [ ! -f "extracted/gaming-app/app/build.gradle" ] &&
             [ ! -f "extracted/gaming-app/app/build.gradle.kts" ]; then
            echo "❌ Gaming app Gradle configuration not found"
            exit 1
          fi

          echo "✅ Gaming app found"

      # -----------------------------------------------------
      # Build Gaming Optimizer
      # -----------------------------------------------------
      - name: Build Gaming Optimizer APK
        working-directory: extracted/gaming-app
        shell: bash
        run: |
          set -e

          chmod +x gradlew 2>/dev/null || true

          if [ -f "./gradlew" ]; then
            ./gradlew --no-daemon --stacktrace clean assembleDebug
          else
            gradle --no-daemon --stacktrace clean assembleDebug
          fi

      # -----------------------------------------------------
      # Check Admin App
      # -----------------------------------------------------
      - name: Check Admin App
        shell: bash
        run: |
          set -e

          if [ ! -d "extracted/admin-app" ]; then
            echo "❌ admin-app folder not found"
            exit 1
          fi

          if [ ! -f "extracted/admin-app/app/build.gradle" ] &&
             [ ! -f "extracted/admin-app/app/build.gradle.kts" ]; then
            echo "❌ Admin app Gradle configuration not found"
            exit 1
          fi

          echo "✅ Admin app found"

      # -----------------------------------------------------
      # Build Admin APK
      # -----------------------------------------------------
      - name: Build Admin APK
        working-directory: extracted/admin-app
        shell: bash
        run: |
          set -e

          chmod +x gradlew 2>/dev/null || true

          if [ -f "./gradlew" ]; then
            ./gradlew --no-daemon --stacktrace clean assembleDebug
          else
            gradle --no-daemon --stacktrace clean assembleDebug
          fi

      # -----------------------------------------------------
      # Collect APKs
      # -----------------------------------------------------
      - name: Collect APK Files
        shell: bash
        run: |
          set -e

          mkdir -p release

          GAMING_APK=$(find extracted/gaming-app/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print -quit)

          ADMIN_APK=$(find extracted/admin-app/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$GAMING_APK" ]; then
            echo "❌ Gaming APK not found"
            exit 1
          fi

          if [ -z "$ADMIN_APK" ]; then
            echo "❌ Admin APK not found"
            exit 1
          fi

          cp "$GAMING_APK" \
            release/SADEE_X_DIMA_GAMING_OPTIMIZER.apk

          cp "$ADMIN_APK" \
            release/SADEE_X_DIMA_ADMIN.apk

          echo ""
          echo "===== APK OUTPUT ====="
          ls -lh release/

      # -----------------------------------------------------
      # Upload APK Artifact
      # -----------------------------------------------------
      - name: Upload Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-ANDROID-APPS
          path: release/*.apk
          retention-days: 30


  # =========================================================
  # ADMIN WEB PANEL / GITHUB PAGES
  # =========================================================
  deploy-admin-web:
    name: Deploy Admin Web Panel
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      # -----------------------------------------------------
      # Find ZIP
      # -----------------------------------------------------
      - name: Find Source ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "❌ No ZIP file found"
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      # -----------------------------------------------------
      # Extract ZIP
      # -----------------------------------------------------
      - name: Extract Source ZIP
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -o "$ZIP_FILE" -d extracted

      # -----------------------------------------------------
      # Find Admin Panel
      # -----------------------------------------------------
      - name: Locate Admin Panel
        shell: bash
        run: |
          set -e

          ADMIN_INDEX=$(find extracted \
            -type f \
            -path "*/admin-panel/index.html" \
            -print -quit)

          if [ -z "$ADMIN_INDEX" ]; then
            echo "❌ admin-panel/index.html not found"
            echo ""
            echo "Available HTML files:"
            find extracted -type f -name "*.html" -print
            exit 1
          fi

          ADMIN_DIR=$(dirname "$ADMIN_INDEX")

          echo "✅ Admin panel found:"
          echo "$ADMIN_DIR"

          echo "ADMIN_DIR=$ADMIN_DIR" >> "$GITHUB_ENV"

      # -----------------------------------------------------
      # Configure GitHub Pages
      # -----------------------------------------------------
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # -----------------------------------------------------
      # Upload Admin Web
      # -----------------------------------------------------
      - name: Upload Admin Panel
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.ADMIN_DIR }}

      # -----------------------------------------------------
      # Deploy
      # -----------------------------------------------------
      - name: Deploy Admin Panel
        id: deployment
        uses: actions/deploy-pages@v4
