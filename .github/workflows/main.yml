name: SADEE X DIMA - Final Build & Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sadee-x-dima-final
  cancel-in-progress: true

jobs:

  # =========================================================
  # BUILD BOTH ANDROID APPS
  # =========================================================

  build-android:
    name: Build Gaming + Admin APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------------------------------
      # FIND ZIP
      # -----------------------------------------------------

      - name: Find Final ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . \
            -maxdepth 1 \
            -type f \
            -iname "*.zip" \
            -print \
            -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository root."
            ls -la
            exit 1
          fi

          echo "ZIP FOUND: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      # -----------------------------------------------------
      # EXTRACT
      # -----------------------------------------------------

      - name: Extract Final ZIP
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -o "$ZIP_FILE" -d extracted

          echo "ZIP extracted."

          find extracted -maxdepth 4 -type f | head -200

      # -----------------------------------------------------
      # FIND GAMING APP
      # -----------------------------------------------------

      - name: Locate Gaming App
        shell: bash
        run: |
          set -e

          GAMING_SETTINGS=$(find extracted \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -path "*/gaming-app/*" \
            -print \
            -quit)

          if [ -z "$GAMING_SETTINGS" ]; then
            echo "ERROR: Gaming Android project not found."
            find extracted -type f
            exit 1
          fi

          GAMING_DIR=$(dirname "$GAMING_SETTINGS")

          echo "Gaming App:"
          echo "$GAMING_DIR"

          echo "GAMING_DIR=$GAMING_DIR" >> "$GITHUB_ENV"

      # -----------------------------------------------------
      # FIND ADMIN APP
      # -----------------------------------------------------

      - name: Locate Admin App
        shell: bash
        run: |
          set -e

          ADMIN_SETTINGS=$(find extracted \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -path "*/admin-app/*" \
            -print \
            -quit)

          if [ -z "$ADMIN_SETTINGS" ]; then
            echo "ERROR: Admin Android project not found."
            find extracted -type f
            exit 1
          fi

          ADMIN_APP_DIR=$(dirname "$ADMIN_SETTINGS")

          echo "Admin App:"
          echo "$ADMIN_APP_DIR"

          echo "ADMIN_APP_DIR=$ADMIN_APP_DIR" >> "$GITHUB_ENV"

      # -----------------------------------------------------
      # JAVA
      # -----------------------------------------------------

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # -----------------------------------------------------
      # GRADLE
      # -----------------------------------------------------

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # =====================================================
      # BUILD GAMING APP
      # =====================================================

      - name: Build Gaming Optimizer
        working-directory: ${{ env.GAMING_DIR }}
        shell: bash
        run: |
          set -e

          echo "================================"
          echo "BUILDING GAMING OPTIMIZER"
          echo "================================"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew

            ./gradlew \
              --no-daemon \
              --stacktrace \
              clean \
              assembleDebug
          else
            gradle \
              --no-daemon \
              --stacktrace \
              clean \
              assembleDebug
          fi

      # =====================================================
      # BUILD ADMIN APP
      # =====================================================

      - name: Build Admin App
        working-directory: ${{ env.ADMIN_APP_DIR }}
        shell: bash
        run: |
          set -e

          echo "================================"
          echo "BUILDING ADMIN APP"
          echo "================================"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew

            ./gradlew \
              --no-daemon \
              --stacktrace \
              clean \
              assembleDebug
          else
            gradle \
              --no-daemon \
              --stacktrace \
              clean \
              assembleDebug
          fi

      # =====================================================
      # COLLECT APKs
      # =====================================================

      - name: Collect APKs
        shell: bash
        run: |
          set -e

          mkdir -p release

          GAMING_APK=$(find "$GAMING_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print \
            -quit)

          ADMIN_APK=$(find "$ADMIN_APP_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print \
            -quit)

          if [ -z "$GAMING_APK" ]; then
            echo "ERROR: Gaming APK not found."
            exit 1
          fi

          if [ -z "$ADMIN_APK" ]; then
            echo "ERROR: Admin APK not found."
            exit 1
          fi

          cp "$GAMING_APK" \
            release/SADEE_X_DIMA_GAMING_OPTIMIZER.apk

          cp "$ADMIN_APK" \
            release/SADEE_X_DIMA_ADMIN.apk

          echo ""
          echo "FINAL APK FILES:"
          ls -lh release/

      # -----------------------------------------------------
      # UPLOAD APKs
      # -----------------------------------------------------

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-FINAL-APPS
          path: release/*.apk
          retention-days: 30


  # =========================================================
  # DEPLOY ADMIN WEB PANEL
  # =========================================================

  deploy-admin:
    name: Deploy Admin Web Panel
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------------------------------
      # FIND ZIP
      # -----------------------------------------------------

      - name: Find Final ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . \
            -maxdepth 1 \
            -type f \
            -iname "*.zip" \
            -print \
            -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP found."
            ls -la
            exit 1
          fi

          echo "ZIP FOUND: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      # -----------------------------------------------------
      # EXTRACT
      # -----------------------------------------------------

      - name: Extract Final ZIP
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -o "$ZIP_FILE" -d extracted

      # -----------------------------------------------------
      # LOCATE ADMIN WEB
      # -----------------------------------------------------

      - name: Locate Admin Web
        shell: bash
        run: |
          set -e

          echo "Searching for Admin Panel..."

          ADMIN_INDEX=$(find extracted \
            -type f \
            -path "*/admin-panel/index.html" \
            -print \
            -quit)

          if [ -z "$ADMIN_INDEX" ]; then

            echo "ERROR: admin-panel/index.html not found."

            echo ""
            echo "Available index.html files:"

            find extracted \
              -type f \
              -name "index.html"

            exit 1
          fi

          ADMIN_WEB_DIR=$(dirname "$ADMIN_INDEX")

          echo "ADMIN WEB FOUND:"
          echo "$ADMIN_WEB_DIR"

          echo "ADMIN_WEB_DIR=$ADMIN_WEB_DIR" >> "$GITHUB_ENV"

      # -----------------------------------------------------
      # CHECK FILES
      # -----------------------------------------------------

      - name: Check Admin Web
        shell: bash
        run: |
          set -e

          echo "Admin Web:"
          echo "$ADMIN_WEB_DIR"

          echo ""
          echo "Files:"

          find "$ADMIN_WEB_DIR" \
            -maxdepth 3 \
            -type f

      # -----------------------------------------------------
      # GITHUB PAGES
      # -----------------------------------------------------

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # -----------------------------------------------------
      # UPLOAD PAGE
      # -----------------------------------------------------

      - name: Upload Admin Web
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.ADMIN_WEB_DIR }}

      # -----------------------------------------------------
      # DEPLOY
      # -----------------------------------------------------

      - name: Deploy Admin Web
        id: deployment
        uses: actions/deploy-pages@v4
