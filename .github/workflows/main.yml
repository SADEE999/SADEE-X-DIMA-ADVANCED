
name: SADEE X DIMA APK Builder

'on':
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract uploaded ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 3 -type f \
            -name '*.zip' -not -path './.git/*' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Upload your project ZIP to the repository."
            exit 1
          fi

          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

          echo "ZIP extracted successfully."
          find extracted -type f -name settings.gradle

      - name: Build Gaming APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p extracted/sadee_src/gaming-app assembleDebug

      - name: Build Admin APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p extracted/sadee_src/admin-app assembleDebug

      - name: Upload Gaming APK
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-Gaming-APK
          path: extracted/sadee_src/gaming-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-Admin-APK
          path: extracted/sadee_src/admin-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
