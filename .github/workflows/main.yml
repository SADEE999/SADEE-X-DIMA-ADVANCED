name: SADEE X DIMA - Build Gaming App + Admin App + Admin Web

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sadee-x-dima-all
  cancel-in-progress: true

jobs:

  # =========================================================
  # BUILD ANDROID APPS
  # =========================================================

  build-apps:
    name: Build Gaming Optimizer + Admin APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      # -----------------------------------------------------
      # FIND ZIP
      # -----------------------------------------------------

      - name: Find ZIP
        shell: bash
        run: |
          set -e

          echo "Searching for ZIP..."

          ZIP_FILE=$(find . \
            -maxdepth 1 \
            -type f \
            -iname "*.zip" \
            -print \
            -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository root."
            ls -la
            exit 1
          fi

          echo "ZIP FOUND:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      # -----------------------------------------------------
      # EXTRACT ZIP
      # -----------------------------------------------------

      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          echo "Extracting:"
          echo "$ZIP_FILE"

          unzip -o "$ZIP_FILE" -d extracted

          echo ""
          echo "EXTRACTION COMPLETE"
          echo ""

          find extracted -maxdepth 3 -type f | head -200

      # -----------------------------------------------------
      # VERIFY PROJECTS
      # -----------------------------------------------------

      - name: Verify Projects
        shell: bash
        run: |
          set -e

          echo "Checking Gaming Optimizer..."

          if [ ! -f "extracted/gaming-app/settings.gradle" ] && \
             [ ! -f "extracted/gaming-app/settings.gradle.kts" ]; then
            echo "ERROR: gaming-app Android project not found."
            find extracted -maxdepth 4 -type f
            exit 1
          fi

          echo "Gaming Optimizer OK"

          echo ""
          echo "Checking Admin App..."

          if [ ! -f "extracted/admin-app/settings.gradle" ] && \
             [ ! -f "extracted/admin-app/settings.gradle.kts" ]; then
            echo "ERROR: admin-app Android project not found."
            find extracted -maxdepth 4 -type f
            exit 1
          fi

          echo "Admin App OK"

          echo ""
          echo "Checking Admin Web..."

          if [ ! -f "extracted/admin-panel/index.html" ]; then
            echo "ERROR: admin-panel/index.html not found."
            find extracted -type f -name "index.html"
            exit 1
          fi

          echo "Admin Web OK"

      # -----------------------------------------------------
      # JAVA 17
      # -----------------------------------------------------

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # -----------------------------------------------------
      # GRADLE 8.9
      # -----------------------------------------------------

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # =====================================================
      # GAMING OPTIMIZER APK
      # =====================================================

      - name: Build Gaming Optimizer APK
        working-directory: extracted/gaming-app
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo " BUILDING SADEE X DIMA GAMING APP"
          echo "======================================"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew

            ./gradlew \
              --no-daemon \
              --stacktrace \
              clean \
              assembleDebug
          else
            gradle \
              --no-daemon \
              --stacktrace \
              clean \
              assembleDebug
          fi

      # =====================================================
      # ADMIN APK
      # =====================================================

      - name: Build Admin APK
        working-directory: extracted/admin-app
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo " BUILDING SADEE X DIMA ADMIN APP"
          echo "======================================"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew

            ./gradlew \
              --no-daemon \
              --stacktrace \
              clean \
              assembleDebug
          else
            gradle \
              --no-daemon \
              --stacktrace \
              clean \
              assembleDebug
          fi

      # =====================================================
      # COLLECT APK FILES
      # =====================================================

      - name: Collect APKs
        shell: bash
        run: |
          set -e

          mkdir -p release

          GAMING_APK=$(find \
            extracted/gaming-app/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print \
            -quit)

          ADMIN_APK=$(find \
            extracted/admin-app/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print \
            -quit)

          if [ -z "$GAMING_APK" ]; then
            echo "ERROR: Gaming APK not found."
            find extracted/gaming-app/app/build -type f | head -100
            exit 1
          fi

          if [ -z "$ADMIN_APK" ]; then
            echo "ERROR: Admin APK not found."
            find extracted/admin-app/app/build -type f | head -100
            exit 1
          fi

          cp "$GAMING_APK" \
            release/SADEE_X_DIMA_GAMING_OPTIMIZER.apk

          cp "$ADMIN_APK" \
            release/SADEE_X_DIMA_ADMIN.apk

          echo ""
          echo "APK FILES:"
          ls -lh release/

      # =====================================================
      # UPLOAD APK ARTIFACT
      # =====================================================

      - name: Upload Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-ANDROID-APPS
          path: release/*.apk
          retention-days: 30


  # =========================================================
  # DEPLOY ADMIN WEB PANEL
  # =========================================================

  deploy-admin-web:
    name: Deploy Admin Web Panel
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      # -----------------------------------------------------
      # CHECKOUT
      # -----------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4

      # -----------------------------------------------------
      # FIND ZIP
      # -----------------------------------------------------

      - name: Find ZIP
        shell: bash
        run: |
          set -e

          echo "Searching for ZIP..."

          ZIP_FILE=$(find . \
            -maxdepth 1 \
            -type f \
            -iname "*.zip" \
            -print \
            -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."

            ls -la

            exit 1
          fi

          echo "ZIP FOUND:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      # -----------------------------------------------------
      # EXTRACT
      # -----------------------------------------------------

      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -o "$ZIP_FILE" -d extracted

          echo "ZIP extracted successfully."

      # -----------------------------------------------------
      # LOCATE ADMIN PANEL
      # -----------------------------------------------------

      - name: Locate Admin Panel
        shell: bash
        run: |
          set -e

          echo "Searching for admin-panel..."

          ADMIN_INDEX=$(find extracted \
            -type f \
            -path "*/admin-panel/index.html" \
            -print \
            -quit)

          if [ -z "$ADMIN_INDEX" ]; then

            echo "ERROR: admin-panel/index.html not found."

            echo ""
            echo "Available index.html files:"

            find extracted \
              -type f \
              -name "index.html"

            exit 1
          fi

          ADMIN_DIR=$(dirname "$ADMIN_INDEX")

          echo ""
          echo "ADMIN PANEL FOUND:"
          echo "$ADMIN_DIR"

          echo "ADMIN_DIR=$ADMIN_DIR" >> "$GITHUB_ENV"

      # -----------------------------------------------------
      # CHECK ADMIN FILES
      # -----------------------------------------------------

      - name: Check Admin Panel
        shell: bash
        run: |
          set -e

          echo "Admin directory:"
          echo "$ADMIN_DIR"

          echo ""
          echo "Admin files:"

          find "$ADMIN_DIR" \
            -maxdepth 3 \
            -type f

      # -----------------------------------------------------
      # CONFIGURE GITHUB PAGES
      # -----------------------------------------------------

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      # -----------------------------------------------------
      # UPLOAD WEBSITE
      # -----------------------------------------------------

      - name: Upload Admin Panel
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.ADMIN_DIR }}

      # -----------------------------------------------------
      # DEPLOY
      # -----------------------------------------------------

      - name: Deploy Admin Panel
        id: deployment
        uses: actions/deploy-pages@v4
