name: SADEE X DIMA - Build All Apps + Admin Web

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sadee-x-dima-build
  cancel-in-progress: true

jobs:

  build-android:
    name: Build Android Apps
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP
        shell: bash
        run: |
          set -e
          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -1)

          if [ -z "$ZIP" ]; then
            echo "No source ZIP found"
            exit 1
          fi

          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "Using: $ZIP"

      - name: Extract ZIP
        shell: bash
        run: |
          set -e
          rm -rf extracted
          mkdir extracted
          unzip -o "$ZIP" -d extracted

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Gaming Optimizer
        working-directory: extracted/gaming-app
        shell: bash
        run: |
          set -e
          chmod +x gradlew 2>/dev/null || true

          if [ -f gradlew ]; then
            ./gradlew clean assembleDebug --no-daemon
          else
            gradle clean assembleDebug --no-daemon
          fi

      - name: Build Admin App
        working-directory: extracted/admin-app
        shell: bash
        run: |
          set -e
          chmod +x gradlew 2>/dev/null || true

          if [ -f gradlew ]; then
            ./gradlew clean assembleDebug --no-daemon
          else
            gradle clean assembleDebug --no-daemon
          fi

      - name: Collect APKs
        shell: bash
        run: |
          set -e

          mkdir -p release

          GAME=$(find extracted/gaming-app/app/build/outputs/apk \
            -type f -name "*.apk" | head -1)

          ADMIN=$(find extracted/admin-app/app/build/outputs/apk \
            -type f -name "*.apk" | head -1)

          if [ -z "$GAME" ]; then
            echo "Gaming APK not found"
            exit 1
          fi

          if [ -z "$ADMIN" ]; then
            echo "Admin APK not found"
            exit 1
          fi

          cp "$GAME" release/SADEE_X_DIMA_GAMING_OPTIMIZER.apk
          cp "$ADMIN" release/SADEE_X_DIMA_ADMIN.apk

          ls -lh release

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-APKS
          path: release/*.apk
          retention-days: 30


  deploy-admin:
    name: Deploy Admin Web
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -1)

          if [ -z "$ZIP" ]; then
            echo "No source ZIP found"
            exit 1
          fi

          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract ZIP
        shell: bash
        run: |
          set -e
          rm -rf extracted
          mkdir extracted
          unzip -o "$ZIP" -d extracted

      - name: Find Admin Panel
        shell: bash
        run: |
          set -e

          INDEX=$(find extracted \
            -type f \
            -path "*/admin-panel/index.html" \
            | head -1)

          if [ -z "$INDEX" ]; then
            echo "admin-panel/index.html not found"
            find extracted -type f -name "*.html"
            exit 1
          fi

          DIR=$(dirname "$INDEX")

          echo "ADMIN_DIR=$DIR" >> "$GITHUB_ENV"

          echo "Admin panel:"
          echo "$DIR"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.ADMIN_DIR }}

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
